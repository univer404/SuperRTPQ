name: SuperRTPQ
version: 0.2.2
main: com.superrtpq.SuperRTPQ
api-version: '1.21'
authors: [univer404]
description: Dimension-aware random teleportation and 1v1 RTP matchmaking with separate GUIs.
commands:
  rtp:
    description: Random teleport command and GUI.
    usage: /rtp [gui|now|overworld|nether|end]
    aliases: [randomteleport]
  rtpq:
    description: RTP queue command and separate GUI.
    usage: /rtpq [gui|join|leave|status|admin]
permissions:
  superrtpq.use:
    description: Use instant random teleport.
    default: true
  superrtpq.queue.use:
    description: Use the RTP queue and its GUI.
    default: true
  superrtpq.admin:
    description: Manage SuperRTPQ administration commands.
    default: op
  superrtpq.bypass.cooldown:
    description: Bypass random teleport cooldown.
    default: op