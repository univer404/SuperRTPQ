name: SuperRTPQ
version: 0.2.0
main: com.superrtpq.SuperRTPQ
api-version: '1.21'
authors: [univer404]
description: Standalone random teleport and RTP queue system with GUI.
commands:
  rtp:
    description: Open the SuperRTPQ menu or use RTP commands.
    usage: /rtp [join|leave|status|gui|now]
    aliases: [randomteleport]
  rtpq:
    description: SuperRTPQ administrator commands.
    usage: /rtpq <status|clearqueue|remove|forceteleport|reload|debug>
permissions:
  superrtpq.use:
    description: Use the random teleport queue and GUI.
    default: true
  superrtpq.instant:
    description: Use /rtp now for an immediate random teleport.
    default: op
  superrtpq.admin:
    description: Manage SuperRTPQ.
    default: op
  superrtpq.bypass.cooldown:
    description: Bypass the RTP cooldown.
    default: op